services:
  - type: web
    name: comrades-cyber-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_MODE
        value: private
      - key: BOT_PREFIX
        value: .
      - key: BOT_NAME
        value: Comrades Cyber
      - key: BOT_TIMEZONE
        value: Africa/Nairobi
      - key: OWNER_NUMBER
        sync: false
      - key: SESSION_ID
        sync: false
